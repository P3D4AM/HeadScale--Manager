[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hem"
version = "0.3.2-beta.1"
description = "Headscale Easy Manager — نصب‌کننده هوشمند و مدیر CLI برای Headscale (با آموزش فارسی)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Headscale Easy Manager Contributors" }]
keywords = ["headscale", "tailscale", "vpn", "wireguard", "persian"]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
hsctl = "hem.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
